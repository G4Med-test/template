name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
    # A push changing only these files does not run the pipeline, so neither the
    # validation on Padova nor the publication of results (README, "Small changes").
    # Pull requests always run: their checks are required to merge.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [ "master", "main" ]
  # Also started by ci-workflows when a new Geant4 version is published.
  workflow_dispatch:
    inputs:
      geant4_tag:
        description: geant4-alma9 tag to build with (empty = TAG default in Apptainer.def)
        default: ""
        type: string

jobs:
  run-pipeline:
    if: github.repository != 'G4Med-test/template'

    uses: G4Med-test/ci-workflows/.github/workflows/pipeline.yml@main
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
    with:
      geant4_tag: ${{ inputs.geant4_tag }}
